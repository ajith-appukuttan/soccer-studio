apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: soccer-training
data:
  NODE_ENV: development
  PORT: "4000"
  HOST: "0.0.0.0"
  DATABASE_URL: postgresql://postgres:password123@postgres:5432/soccer_training
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  FRONTEND_URL: http://localhost:3000

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: soccer-training
type: Opaque
data:
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==  # your-jwt-secret-key-change-in-production
  MINIO_ACCESS_KEY: bWluaW9hZG1pbg==  # minioadmin
  MINIO_SECRET_KEY: bWluaW9hZG1pbjEyMw==  # minioadmin123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: soccer-training
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: soccer-training/api-gateway:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: soccer-training
spec:
  selector:
    app: api-gateway
  ports:
  - port: 4000
    targetPort: 4000
  type: LoadBalancer