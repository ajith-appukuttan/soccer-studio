apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: soccer-training
type: Opaque
data:
  JWT_SECRET: ZGV2LXNlY3JldC1rZXk=  # dev-secret-key
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkMTIzQHBvc3RncmVzOjU0MzIvc29jY2VyX3RyYWluaW5n  # postgresql://postgres:password123@postgres:5432/soccer_training

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: soccer-training
data:
  NODE_ENV: "development"
  PORT: "6001"
  FRONTEND_URL: "http://localhost:6000"
  REDIS_URL: "redis://redis:6003"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: soccer-training
  labels:
    app: api-gateway
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
      - name: migrate-db
        image: soccer-training/api-gateway
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        command: ["sh", "-c", "npx prisma migrate deploy && npx prisma generate"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
      containers:
      - name: api-gateway
        image: soccer-training/api-gateway
        ports:
        - containerPort: 6001
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: api-src
          mountPath: /app/src
        livenessProbe:
          httpGet:
            path: /health
            port: 6001
          initialDelaySeconds: 45
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 6001
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: api-src
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: soccer-training
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 6001
    targetPort: 6001
    name: http
  type: ClusterIP