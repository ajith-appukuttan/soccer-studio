apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: soccer-training
data:
  VITE_API_URL: "http://localhost:6001/api"
  VITE_APP_NAME: "Soccer Studio"
  VITE_APP_VERSION: "1.0.0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: soccer-training
  labels:
    app: frontend
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: soccer-training/frontend
        ports:
        - containerPort: 6000
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: frontend-src
          mountPath: /app/src
        livenessProbe:
          httpGet:
            path: /
            port: 6000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 6000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: frontend-src
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: soccer-training
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 6000
    targetPort: 6000
    name: http
  type: ClusterIP