services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: soccer-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: soccer_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6002:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - soccer-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: soccer-redis-dev
    restart: unless-stopped
    ports:
      - "6003:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - soccer-network

volumes:
  postgres_data:
  redis_data:

networks:
  soccer-network:
    driver: bridge